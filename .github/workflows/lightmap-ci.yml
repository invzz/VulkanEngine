name: Lightmap CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Unit & Deterministic Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps (minimal)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libvulkan-dev vulkan-tools

      - name: Build LightmapTests
        run: xmake build -v LightmapTests

      - name: Run unit tests (hardware-dependent tests skip by default)
        run: ./build/linux/x86_64/release/LightmapTests --gtest_color=yes || true

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightmap-tests-logs
          path: build/linux/x86_64/release/*.log || true

  cli-smoke:
    name: UVUnwrap CLI smoke test
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps (minimal)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libvulkan-dev vulkan-tools

      - name: Build CLI & tests
        run: xmake build -v UVUnwrapCLI LightmapTests

      - name: List tools directory
        run: |
          ls -la tools || true
          if [ -f tools/UVUnwrapCLI ]; then echo "Found tools/UVUnwrapCLI"; else echo "tools/UVUnwrapCLI missing"; ls -la build/linux/x86_64/release || true; exit 1; fi

      - name: Run CLI integration test
        run: ./build/linux/x86_64/release/LightmapTests --gtest_filter=UVUnwrapCLI.GeneratesManifestFromInput --gtest_color=yes

      - name: Upload CLI test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uvunwarp-cli-logs
          path: build/linux/x86_64/release/*.log || true

  gpu-integration:
    name: Hardware-dependent integration tests
    runs-on: [self-hosted, linux, gpu]
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build tools & tests
        run: xmake build -v EXR2VTEX LightmapTests

      - name: Smoke-check Vulkan on runner
        run: |
          chmod +x .github/scripts/check_vulkan.sh
          ./.github/scripts/check_vulkan.sh

      - name: Run hardware test (EXR2VTEX integration)
        env:
          RUN_HARDWARE_TESTS: "1"
        run: |
          ./build/linux/x86_64/release/LightmapTests --gtest_filter=LightmapEXR2VTEX.ToolConvertsEXRToVTEX --gtest_color=yes

      - name: Upload hardware test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightmap-hw-logs
          path: build/linux/x86_64/release/*.log || true

  model-light-baker-smoke:
    name: LightBaker scene smoke test
    runs-on: [self-hosted, linux, gpu]
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps (minimal)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libvulkan-dev vulkan-tools

      - name: Build LightBaker & tests
        run: xmake build -v LightBaker LightmapTests

      - name: List tools directory
        run: |
          ls -la tools || true
          if [ -f tools/LightBaker ]; then echo "Found tools/LightBaker"; else echo "tools/LightBaker missing"; ls -la build/linux/x86_64/release || true; exit 1; fi

      - name: Smoke-check Vulkan on runner
        run: |
          chmod +x .github/scripts/check_vulkan.sh
          ./.github/scripts/check_vulkan.sh

      - name: Run LightBaker scene integration test
        env:
          RUN_HARDWARE_TESTS: "1"
        run: |
          ./build/linux/x86_64/release/LightmapTests --gtest_filter=LightBaker.SceneLights_CLIIncludesBakedLightsInManifest --gtest_color=yes

      - name: Upload LightBaker artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightbaker-logs
          path: build/linux/x86_64/release/*.log || true
